<svg xmlns="http://www.w3.org/2000/svg" width="680" height="845" viewBox="0 0 680 845" role="img" aria-labelledby="title desc">
  <title id="title">Preparación y ejecución de PHP y C# con .NET</title>
  <desc id="desc">PHP atiende la petición mediante su runtime; OPcache puede conservar código compilado. C# se compila antes a IL. Durante una petición, el runtime .NET aplica JIT a IL si hace falta y ejecuta el código. Son rutas habituales, no las únicas formas de publicación.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #172554; }
    .panel { fill: #ffffff; stroke: #94a3b8; stroke-width: 3; }
    .php { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 3; }
    .dotnet { fill: #ecfdf5; stroke: #047857; stroke-width: 3; }
    .neutral { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 3; }
    .note { fill: #fff7ed; stroke: #c2410c; stroke-width: 3; }
    .arrow { fill: none; stroke: #0f172a; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#0f172a"/></marker></defs>
  <rect width="680" height="845" fill="#ffffff"/>
  <text x="340" y="40" text-anchor="middle" font-size="30" font-weight="700">Dos rutas, un mismo propósito web</text>
  <text x="340" y="72" text-anchor="middle" font-size="24">Preparar no es atender la petición.</text>
  <rect class="panel" x="20" y="94" width="640" height="250" rx="16"/>
  <text x="45" y="130" font-size="28" font-weight="700">PHP: ejecución al atender la petición</text>
  <rect class="note" x="45" y="145" width="590" height="65" rx="10"/>
  <text x="340" y="172" text-anchor="middle" font-size="24">OPcache puede conservar código compilado;</text>
  <text x="340" y="200" text-anchor="middle" font-size="24">no siempre se recompila.</text>
  <text x="45" y="240" font-size="24" font-weight="700">Durante la petición</text>
  <rect class="neutral" x="45" y="260" width="160" height="70" rx="10"/>
  <text x="125" y="289" text-anchor="middle" font-size="25" font-weight="700">Petición</text>
  <text x="125" y="317" text-anchor="middle" font-size="24">HTTP</text>
  <rect class="php" x="255" y="260" width="190" height="70" rx="10"/>
  <text x="350" y="289" text-anchor="middle" font-size="25" font-weight="700">Runtime PHP</text>
  <text x="350" y="317" text-anchor="middle" font-size="24">ejecuta la app</text>
  <rect class="neutral" x="510" y="260" width="125" height="70" rx="10"/>
  <text x="572" y="289" text-anchor="middle" font-size="24">Respuesta</text>
  <text x="572" y="317" text-anchor="middle" font-size="24">HTTP</text>
  <line class="arrow" x1="207" y1="295" x2="247" y2="295"/>
  <line class="arrow" x1="447" y1="295" x2="502" y2="295"/>
  <rect class="panel" x="20" y="370" width="640" height="450" rx="16"/>
  <text x="45" y="407" font-size="28" font-weight="700">C# y .NET: preparación y ejecución</text>
  <text x="45" y="444" font-size="24" font-weight="700">Preparación antes de atender peticiones</text>
  <rect class="dotnet" x="45" y="465" width="160" height="85" rx="10"/>
  <text x="125" y="500" text-anchor="middle" font-size="25" font-weight="700">Código C#</text>
  <text x="125" y="532" text-anchor="middle" font-size="24">fuente</text>
  <rect class="neutral" x="255" y="465" width="190" height="85" rx="10"/>
  <text x="350" y="500" text-anchor="middle" font-size="25" font-weight="700">Compilación</text>
  <text x="350" y="532" text-anchor="middle" font-size="24">del proyecto</text>
  <rect class="dotnet" x="510" y="465" width="125" height="85" rx="10"/>
  <text x="572" y="500" text-anchor="middle" font-size="25" font-weight="700">IL</text>
  <text x="572" y="532" text-anchor="middle" font-size="24">generado</text>
  <line class="arrow" x1="207" y1="507" x2="247" y2="507"/>
  <line class="arrow" x1="447" y1="507" x2="502" y2="507"/>
  <text x="45" y="598" font-size="24" font-weight="700">Durante la petición</text>
  <rect class="neutral" x="45" y="620" width="160" height="140" rx="10"/>
  <text x="125" y="653" text-anchor="middle" font-size="25" font-weight="700">Petición</text>
  <text x="125" y="685" text-anchor="middle" font-size="24">HTTP</text>
  <text x="125" y="724" text-anchor="middle" font-size="24">a la app</text>
  <rect class="dotnet" x="255" y="620" width="190" height="140" rx="10"/>
  <text x="350" y="653" text-anchor="middle" font-size="25" font-weight="700">Runtime .NET</text>
  <text x="350" y="685" text-anchor="middle" font-size="24">JIT compila IL</text>
  <text x="350" y="715" text-anchor="middle" font-size="24">si hace falta;</text>
  <text x="350" y="745" text-anchor="middle" font-size="24">ejecuta código</text>
  <rect class="neutral" x="510" y="620" width="125" height="140" rx="10"/>
  <text x="572" y="653" text-anchor="middle" font-size="24">Respuesta</text>
  <text x="572" y="685" text-anchor="middle" font-size="24">HTTP</text>
  <line class="arrow" x1="207" y1="690" x2="247" y2="690"/>
  <line class="arrow" x1="447" y1="690" x2="502" y2="690"/>
  <text x="340" y="804" text-anchor="middle" font-size="24">Ruta JIT habitual; existen otras estrategias.</text>
</svg>
