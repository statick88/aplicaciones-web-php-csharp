<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title desc">
  <title id="title">Alcance de una variable</title>
  <desc id="desc">Una variable declarada fuera de una función tiene alcance exterior y un parámetro existe dentro de la función, donde se recomienda pasar los datos necesarios.</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#172554}.outer{fill:#eff6ff;stroke:#2563eb;stroke-width:3}.inner{fill:#f0fdf4;stroke:#16a34a;stroke-width:3}.code{font-family:monospace;font-size:20px}</style>
  <rect class="outer" x="55" y="45" width="850" height="220" rx="14"/><text x="85" y="82" font-size="22">Alcance exterior</text><text class="code" x="100" y="120">$iva = 0.19;</text><text class="code" x="100" y="235">// Evita depender de un valor exterior sin declararlo.</text>
  <rect class="inner" x="385" y="100" width="450" height="105" rx="12"/><text x="415" y="135" font-size="21">Función: alcance local</text><text class="code" x="415" y="175">calcularTotal($precio, $iva)</text><text x="720" y="235" text-anchor="end" font-size="17">El parámetro hace explícita la dependencia.</text>
</svg>
