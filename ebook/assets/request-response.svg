<svg xmlns="http://www.w3.org/2000/svg" width="680" height="630" viewBox="0 0 680 630" role="img" aria-labelledby="title desc">
  <title id="title">Petición, PHP o C# y respuesta HTML</title>
  <desc id="desc">Dos ejemplos del mismo ciclo: 1, el navegador envía una petición HTTP; 2, PHP o C# ejecutado por .NET procesa la petición en el servidor; 3, una respuesta con cuerpo HTML vuelve al navegador, que la muestra. El servidor web coordina HTTP. El código PHP o C# no se envía al navegador.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #172554; }
    .client { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 3; }
    .program { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 3; }
    .response { fill: #ecfeff; stroke: #0f766e; stroke-width: 3; }
    .arrow { fill: none; stroke: #0f172a; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M 0 0 L 12 5 L 0 10 z" fill="#0f172a"/></marker>
  </defs>
  <rect width="680" height="630" fill="#ffffff"/>
  <text x="340" y="38" text-anchor="middle" font-size="30" font-weight="700">Petición → programa → respuesta HTML</text>
  <text x="340" y="70" text-anchor="middle" font-size="24">El navegador no recibe código PHP ni C#.</text>

  <text x="340" y="111" text-anchor="middle" font-size="28" font-weight="700">PHP en el servidor</text>
  <rect class="client" x="30" y="135" width="180" height="120" rx="12"/>
  <text x="120" y="173" text-anchor="middle" font-size="28" font-weight="700">1. Petición</text>
  <text x="120" y="211" text-anchor="middle" font-size="26">Navegador</text>
  <text x="120" y="239" text-anchor="middle" font-size="24">envía HTTP</text>
  <rect class="program" x="240" y="135" width="200" height="120" rx="12"/>
  <text x="340" y="173" text-anchor="middle" font-size="28" font-weight="700">2. PHP</text>
  <text x="340" y="211" text-anchor="middle" font-size="24">Ejecuta el</text>
  <text x="340" y="239" text-anchor="middle" font-size="24">programa</text>
  <rect class="response" x="470" y="135" width="180" height="120" rx="12"/>
  <text x="560" y="173" text-anchor="middle" font-size="26" font-weight="700">3. Respuesta</text>
  <text x="560" y="211" text-anchor="middle" font-size="28" font-weight="700">HTML</text>
  <text x="560" y="239" text-anchor="middle" font-size="24">al navegador</text>
  <line class="arrow" x1="213" y1="195" x2="231" y2="195"/>
  <line class="arrow" x1="443" y1="195" x2="461" y2="195"/>
  <path class="arrow" d="M 560 257 V 285 H 120 V 262"/>
  <text x="340" y="317" text-anchor="middle" font-size="24">El navegador recibe y muestra el HTML.</text>

  <text x="340" y="366" text-anchor="middle" font-size="28" font-weight="700">C# en el servidor</text>
  <rect class="client" x="30" y="390" width="180" height="120" rx="12"/>
  <text x="120" y="428" text-anchor="middle" font-size="28" font-weight="700">1. Petición</text>
  <text x="120" y="466" text-anchor="middle" font-size="26">Navegador</text>
  <text x="120" y="494" text-anchor="middle" font-size="24">envía HTTP</text>
  <rect class="program" x="240" y="390" width="200" height="120" rx="12"/>
  <text x="340" y="428" text-anchor="middle" font-size="28" font-weight="700">2. C#</text>
  <text x="340" y="466" text-anchor="middle" font-size="24">.NET ejecuta</text>
  <text x="340" y="494" text-anchor="middle" font-size="24">el programa</text>
  <rect class="response" x="470" y="390" width="180" height="120" rx="12"/>
  <text x="560" y="428" text-anchor="middle" font-size="26" font-weight="700">3. Respuesta</text>
  <text x="560" y="466" text-anchor="middle" font-size="28" font-weight="700">HTML</text>
  <text x="560" y="494" text-anchor="middle" font-size="24">al navegador</text>
  <line class="arrow" x1="213" y1="450" x2="231" y2="450"/>
  <line class="arrow" x1="443" y1="450" x2="461" y2="450"/>
  <path class="arrow" d="M 560 512 V 540 H 120 V 517"/>
  <text x="340" y="572" text-anchor="middle" font-size="24">El navegador recibe y muestra el HTML.</text>
  <text x="340" y="612" text-anchor="middle" font-size="24">El servidor web coordina HTTP en ambos casos.</text>
</svg>
