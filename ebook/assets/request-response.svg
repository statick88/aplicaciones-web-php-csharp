<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Solicitud y respuesta en una aplicación web</title>
  <desc id="desc">Un navegador envía una solicitud HTTP a un servidor que procesa código PHP o C# y devuelve una respuesta al navegador.</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#172554}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.arrow{stroke:#0f766e;stroke-width:4;marker-end:url(#p)}</style>
  <defs><marker id="p" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#0f766e"/></marker></defs>
  <rect class="box" x="50" y="90" width="210" height="100" rx="12"/><text x="155" y="132" text-anchor="middle" font-size="24">Navegador</text><text x="155" y="163" text-anchor="middle" font-size="17">persona usuaria</text>
  <rect class="box" x="375" y="90" width="210" height="100" rx="12"/><text x="480" y="132" text-anchor="middle" font-size="24">Servidor web</text><text x="480" y="163" text-anchor="middle" font-size="17">PHP o C# procesa</text>
  <rect class="box" x="700" y="90" width="210" height="100" rx="12"/><text x="805" y="132" text-anchor="middle" font-size="24">Respuesta</text><text x="805" y="163" text-anchor="middle" font-size="17">HTML, estado o datos</text>
  <line class="arrow" x1="265" y1="112" x2="368" y2="112"/><text x="316" y="92" text-anchor="middle" font-size="17">solicitud HTTP</text>
  <line class="arrow" x1="590" y1="168" x2="693" y2="168"/><text x="642" y="210" text-anchor="middle" font-size="17">respuesta HTTP</text>
</svg>
