<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370" role="img" aria-labelledby="title desc">
  <title id="title">Petición, C# mediante .NET y respuesta HTML</title>
  <desc id="desc">Flujo C#: 1, el navegador envía una petición HTTP; 2, la plataforma .NET ejecuta el programa C# en el servidor; 3, una respuesta con cuerpo HTML vuelve al navegador, que la muestra.</desc>
  <style>
    text { font-family: "FiraCode Nerd Font"; fill: #172554; }
    .client { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 3; }
    .program { fill: #ecfdf5; stroke: #047857; stroke-width: 3; }
    .response { fill: #ecfeff; stroke: #0f766e; stroke-width: 3; }
    .arrow { fill: none; stroke: #0f172a; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#0f172a"/></marker></defs>
  <rect width="680" height="370" fill="#ffffff"/>
  <text x="340" y="40" text-anchor="middle" font-size="30" font-weight="700">Flujo HTTP con C#</text>
  <text x="340" y="72" text-anchor="middle" font-size="24">El navegador recibe HTML, no código C#.</text>
  <rect class="client" x="20" y="105" width="200" height="120" rx="12"/>
  <text x="120" y="143" text-anchor="middle" font-size="28" font-weight="700">1. Petición</text>
  <text x="120" y="181" text-anchor="middle" font-size="26">Navegador</text>
  <text x="120" y="209" text-anchor="middle" font-size="24">envía HTTP</text>
  <rect class="program" x="245" y="105" width="190" height="120" rx="12"/>
  <text x="340" y="143" text-anchor="middle" font-size="28" font-weight="700">2. C#</text>
  <text x="340" y="181" text-anchor="middle" font-size="24">.NET ejecuta</text>
  <text x="340" y="209" text-anchor="middle" font-size="24">el programa</text>
  <rect class="response" x="460" y="105" width="200" height="120" rx="12"/>
  <text x="560" y="143" text-anchor="middle" font-size="25" font-weight="700">3. Respuesta</text>
  <text x="560" y="181" text-anchor="middle" font-size="28" font-weight="700">HTML</text>
  <text x="560" y="209" text-anchor="middle" font-size="24">al navegador</text>
  <line class="arrow" x1="223" y1="165" x2="237" y2="165"/>
  <line class="arrow" x1="438" y1="165" x2="452" y2="165"/>
  <path class="arrow" d="M560 227 V255 H120 V232"/>
  <text x="340" y="293" text-anchor="middle" font-size="24">El navegador recibe y muestra el HTML.</text>
  <text x="340" y="332" text-anchor="middle" font-size="24">El servidor web coordina la petición HTTP.</text>
</svg>
