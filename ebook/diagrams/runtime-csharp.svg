<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650" role="img" aria-labelledby="title desc">
  <title id="title">Preparación y ejecución de C# con .NET</title>
  <desc id="desc">El proyecto C# se compila antes a IL. Durante una petición, el runtime .NET aplica JIT a IL si hace falta y ejecuta el código para producir la respuesta.</desc>
  <style>
    text { font-family: "FiraCode Nerd Font"; fill: #172554; }
    .panel { fill: #ffffff; stroke: #94a3b8; stroke-width: 3; }
    .dotnet { fill: #ecfdf5; stroke: #047857; stroke-width: 3; }
    .neutral { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 3; }
    .arrow { fill: none; stroke: #0f172a; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 L12 5 L0 10 Z" fill="#0f172a"/></marker></defs>
  <rect width="680" height="650" fill="#ffffff"/>
  <text x="340" y="40" text-anchor="middle" font-size="30" font-weight="700">C# y .NET: preparación y ejecución</text>
  <rect class="panel" x="20" y="65" width="640" height="560" rx="16"/>
  <text x="45" y="110" font-size="24" font-weight="700">Preparación antes de atender peticiones</text>
  <rect class="dotnet" x="45" y="135" width="160" height="90" rx="10"/>
  <text x="125" y="171" text-anchor="middle" font-size="25" font-weight="700">Código C#</text>
  <text x="125" y="203" text-anchor="middle" font-size="24">fuente</text>
  <rect class="neutral" x="245" y="135" width="210" height="90" rx="10"/>
  <text x="350" y="171" text-anchor="middle" font-size="25" font-weight="700">Compilación</text>
  <text x="350" y="203" text-anchor="middle" font-size="24">del proyecto</text>
  <rect class="dotnet" x="495" y="135" width="140" height="90" rx="10"/>
  <text x="565" y="171" text-anchor="middle" font-size="25" font-weight="700">IL</text>
  <text x="565" y="203" text-anchor="middle" font-size="24">generado</text>
  <line class="arrow" x1="207" y1="180" x2="237" y2="180"/>
  <line class="arrow" x1="457" y1="180" x2="487" y2="180"/>
  <text x="45" y="285" font-size="24" font-weight="700">Durante la petición</text>
  <rect class="neutral" x="45" y="310" width="160" height="155" rx="10"/>
  <text x="125" y="350" text-anchor="middle" font-size="25" font-weight="700">Petición</text>
  <text x="125" y="384" text-anchor="middle" font-size="24">HTTP</text>
  <text x="125" y="425" text-anchor="middle" font-size="24">a la app</text>
  <rect class="dotnet" x="232" y="310" width="236" height="155" rx="10"/>
  <text x="350" y="350" text-anchor="middle" font-size="25" font-weight="700">Runtime .NET</text>
  <text x="350" y="384" text-anchor="middle" font-size="24">JIT compila IL</text>
  <text x="350" y="416" text-anchor="middle" font-size="24">si hace falta y</text>
  <text x="350" y="448" text-anchor="middle" font-size="24">ejecuta código</text>
  <rect class="neutral" x="485" y="310" width="160" height="155" rx="10"/>
  <text x="565" y="365" text-anchor="middle" font-size="24">Respuesta</text>
  <text x="565" y="401" text-anchor="middle" font-size="24">HTTP</text>
  <line class="arrow" x1="207" y1="387" x2="222" y2="387"/>
  <line class="arrow" x1="470" y1="387" x2="480" y2="387"/>
  <text x="340" y="525" text-anchor="middle" font-size="24">Ruta JIT habitual;</text>
  <text x="340" y="557" text-anchor="middle" font-size="24">existen otras estrategias de publicación.</text>
</svg>
