project:
  type: book
  output-dir: _book

book:
  output-file: aplicaciones-web-php-csharp-semana1
  downloads: [pdf]
  favicon: assets/favicon.svg
  title: "Cuaderno de estudio y práctica — Ingeniería de Software"
  author: "Diego Saavedra"
  subtitle: "Teoría, práctica y preparación para evaluaciones por asignatura y semana"
  site-url: "https://statick88.github.io/aplicaciones-web-php-csharp/"
  repo-url: "https://github.com/statick88/aplicaciones-web-php-csharp"
  repo-actions: [issue]
  chapters:
    - index.qmd
    - part: subjects/aplicaciones-web.qmd
      chapters:
        - part: "Semana 1"
          chapters:
            - chapters/01-web-foundations.qmd
            - chapters/02-variables-types-scope.qmd
            - chapters/03-week1-practice-review.qmd
            - chapters/04-development-environment.qmd
    - answers.qmd
    - references.qmd

bibliography: references.bib
lang: es

format:
  html:
    theme: solar
    css: assets/styles.css
    toc: true
    toc-depth: 3
    number-sections: true
  typst:
    output-file: aplicaciones-web-php-csharp-semana1.pdf
    toc: true
    number-sections: true

execute:
  freeze: auto
