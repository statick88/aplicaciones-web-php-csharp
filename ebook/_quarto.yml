project:
  type: book
  output-dir: _book
  resources:
    - examples/http-methods/**
    - assets/fonts/fira-code-nerd/**

book:
  output-file: aplicaciones-web-php-csharp-semana1
  downloads: [pdf]
  favicon: assets/favicon.svg
  title: "Cuaderno de estudio y práctica — Ingeniería de Software"
  author: "Diego Saavedra"
  subtitle: "Teoría, práctica y preparación para evaluaciones por asignatura y semana"
  site-url: "https://statick88.github.io/aplicaciones-web-php-csharp/"
  repo-url: "https://github.com/statick88/aplicaciones-web-php-csharp"
  repo-actions: [issue]
  chapters:
    - index.qmd
    - part: subjects/aplicaciones-web.qmd
      chapters:
        - chapters/01-web-foundations.qmd
        - chapters/02-variables-types-scope.qmd
        - chapters/03-week1-practice-review.qmd
        - chapters/04-development-environment.qmd
        - subjects/aplicaciones-web/consulta-http.qmd
        - subjects/aplicaciones-web/laboratorio-http-php.qmd
        - answers.qmd
    - part: subjects/arquitectura-software.qmd
      chapters:
        - subjects/arquitectura-software/semana-01/01-diseno-arquitectura.qmd
        - subjects/arquitectura-software/semana-01/02-dominios-mitos.qmd
        - subjects/arquitectura-software/semana-01/03-practica-autoevaluacion.qmd
        - subjects/arquitectura-software/semana-02/01-procesos-flujo.qmd
        - subjects/arquitectura-software/semana-02/02-modelos-practica-autoevaluacion.qmd
    - subjects/gestion-empresarial-emprendimiento.qmd
    - subjects/inteligencia-artificial.qmd
    - subjects/inteligencia-negocios.qmd
    - subjects/proyectos-informaticos.qmd
    - references.qmd

bibliography: references.bib
lang: es

format:
  html:
    theme: solar
    css: assets/styles.css
    toc: true
    toc-depth: 3
    number-sections: true
  typst:
    monofont: "FiraCode Nerd Font"
    output-file: aplicaciones-web-php-csharp-semana1.pdf
    toc: true
    number-sections: true
    font-paths:
      - assets/fonts/fira-code-nerd
    include-in-header: assets/typography.typ

execute:
  freeze: auto
