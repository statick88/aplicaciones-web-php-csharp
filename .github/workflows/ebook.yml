name: Publicar ebook de Semana 1

on:
  push:
    branches: [main]
    paths:
      - "ebook/**"
      - ".github/workflows/ebook.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: 1.10.19
      - name: Comprobar la estructura del libro
        run: python3 ebook/scripts/check_book.py
      - name: Renderizar HTML y PDF juntos
        run: quarto render ebook
      - name: Comprobar los artefactos renderizados
        run: python3 ebook/scripts/check_book.py --rendered
      - name: Subir el sitio estático
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ebook/_book

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
