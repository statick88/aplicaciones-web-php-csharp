name: Publicar sitio estático

on:
  push:
    branches: [main]
    paths:
      - "course/**"
      - "site/**"
      - "tools/**"
      - "ebook/**"
      - "requirements-docs.txt"
      - "tests/**"
      - ".github/workflows/ebook.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Instalar dependencias de documentación
        run: python3 -m venv .venv && .venv/bin/pip install -r requirements-docs.txt
      - name: Probar el generador
        run: .venv/bin/python -m unittest tests/test_build_site.py -v
      - name: Probar verificaciones editoriales preservadas
        run: python3 -m unittest discover ebook/tests -v
      - name: Probar la búsqueda del sitio
        run: node --test site/course-utils.test.mjs
      - name: Construir el sitio estático
        run: .venv/bin/python tools/build_site.py --output _site
      - name: Validar el sitio estático
        run: .venv/bin/python tools/build_site.py --output _site --check
      - name: Subir el sitio estático
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
