<!doctype html>
<html lang="es-EC">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="stylesheet" href="{{root}}styles.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="site-header">
    <a class="brand" href="{{root}}" aria-label="Ir al inicio de Practica PHP y .NET">
      <span class="brand-marks" aria-hidden="true"><span class="php-mark">PHP</span><span class="dotnet-mark">.NET</span></span>
      <strong>Practica PHP y .NET</strong>
    </a>
    <a class="route-link" href="{{root}}index.html#catalogo">Recorrido <span aria-hidden="true">↓</span></a>
  </header>
  <main id="contenido" tabindex="-1">
    <div class="lesson-layout">
      <aside class="lesson-sidebar" aria-label="Navegación de lecciones">{{navigation}}</aside>
      <article class="lesson">
        <p class="eyebrow">{{week}}</p>
        <h1{{heading_id}}>{{title}}</h1>
        {{content}}
        <p class="quiz-progress" hidden aria-live="polite"></p>
        <nav class="lesson-pagination" aria-label="Lección anterior y siguiente">{{pagination}}</nav>
      </article>
    </div>
  </main>
  <footer class="site-footer">Material local de apoyo para Programación Web. No ejecuta PHP ni servicios remotos.</footer>
  <script type="module" src="{{root}}quiz.mjs"></script>
</body>
</html>
